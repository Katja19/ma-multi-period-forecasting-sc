site_name: Master Thesis - Multi Period Forecasting
site_description: This is a documentation of the Master Thesis "Multi Period Forecasting".
site_url: https://katja19.github.io/multi-period-forecasting/
repo_url: https://github.com/Katja19/multi-period-forecasting

## wegen image problemen
#site_url: https://katja19.github.io/multi-period-forecasting/
use_directory_urls: true
##

theme:
  name: material
  #custom_dir: docs/overrides
  logo: assets/images/icons8-graph-64.png
  favicon: assets/images/icons8-graph-96.ico
  features:
    - navigation.tabs         # add tabs to the top of the page for the top level navigation
    - navigation.tabs.sticky  # make the tabs always visible when scrolling down, not good compatible with header.autohide
    #- navigation.prune       # prune the navigation to only the active page and its ancestors
    - navigation.footer       # add footer navigation to the bottom of the page
    - navigation.top          # button appears top middle when scrolling up
    - navigation.tracking     # add tracking to the navigation so it updates when scrolling
    - navigation.indexes      # add indexes to the navigation so they are not twice in the navigation
    - toc.integrate           # integrate the table of contents into the navigation
    #- toc.follow             # only works with markdown_extensions.toc.permalink: true
    - header.autohide         # header hides when scrolling down
    - search.highlight        # highlight the search results after following a search result
    - search.suggest          # suggest search words while typing
    - content.code.copy       # add a button to copy code blocks
    # TODO: to be tested if it works and is needed
    - content.code.annotate   # 
    - content.tabs.link       #
  
  # TODO: language: en or de
  palette: 
    # Dark mode
    - scheme: slate # the name of the dark mode of material for mkdocs
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple
    # Light mode
    - scheme: default # the name of the light mode of material for mkdocs
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: indigo
      accent: deep orange

extra_css:
  - stylesheets/extra.css #TODO:



# TODO: ?
extra_javascript: 
  #for the equations, source: https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/?h=arithmatex#arithmatex-docsjavascriptsmathjaxjs
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # for the tablesorter, source: https://squidfunk.github.io/mkdocs-material/reference/data-tables/?h=table#sortable-tables-mkdocsyml
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - https://cdn.plot.ly/plotly-latest.min.js  # Fügt die Plotly-Bibliothek hinzu
  # dont work - assets/plots/plot.html
  #- https://unpkg.com/mermaid@10.2.0/dist/mermaid.min.js

plugins:
  - search # bilds a search index form all pages, source: https://squidfunk.github.io/mkdocs-material/plugins/search/
  - plotly # source: https://github.com/haoda-li/mkdocs-plotly-plugin
      
markdown_extensions:
  #- def_list # allows to use definition lists, source: https://jimandreas.github.io/mkdocs-material/reference/lists/?h=lists
  - attr_list # allows to add html attr and css classes to markdown elements
  # this is for the icons, source: https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/?h=icon
  - pymdownx.emoji: 
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # this is for the code bocks, source: https://squidfunk.github.io/mkdocs-material/reference/code-blocks/?h=code
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # this is fore tabs, source: https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/?h=tabbed#tabbed
  - pymdownx.tabbed: 
      alternate_style: true
  - admonition # this is for Notes, Attention Info etc. boxes, source https://squidfunk.github.io/mkdocs-material/reference/admonitions/?h=ad
  - pymdownx.details # this is for details boxes that can be opened or closed by the user
  # this for equations, source: https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/?h=arithmatex#arithmatex-docsjavascriptsmathjaxjs
  - pymdownx.arithmatex:
      generic: true
  - tables # TODO: coment
  - md_in_html # TODO: coment for the plotly graphs?


  - pymdownx.superfences:
      custom_fences: # this is for diagrams, like ER or Flow, source: https://squidfunk.github.io/mkdocs-material/reference/diagrams/?h=diagram
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        # for plotly graphs, source: https://github.com/haoda-li/mkdocs-plotly-plugin
        - name: plotly
          class: mkdocs-plotly
          #format: "mkdocs_plotly_plugin.fences.fence_plotly"
          format: !!python/name:mkdocs_plotly_plugin.fences.fence_plotly



  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

